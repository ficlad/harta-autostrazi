name: Actualizare filmări și știri

on:
  schedule:
    - cron: '46 5 * * 1,4'   # luni și joi, 07:46 ora României de vară (05:46 UTC)
  workflow_dispatch:          # buton „Run workflow” pentru rulare manuală

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Caută filmări și știri
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/update.mjs
      - name: Reconstruiește pagina
        run: node scripts/build.mjs
      - name: Salvează modificările
        run: |
          git config user.name "harta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json index.html
          git diff --cached --quiet || git commit -m "Actualizare automată filmări și știri"
          git push
